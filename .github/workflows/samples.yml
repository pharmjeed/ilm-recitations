name: Samples
on: workflow_dispatch
jobs:
  samples:
    runs-on: macos-15
    steps:
      - name: Encode one ayah several ways
        run: |
          mkdir -p out
          curl -sf -o src.mp3 https://everyayah.com/data/Alafasy_128kbps/002255.mp3
          afinfo src.mp3 | grep -E "Data format|bit rate" || true
          try() { name=$1; shift; if afconvert -f m4af "$@" src.mp3 "out/$name.m4a" 2>err.txt; then echo "OK $name $(stat -f %z out/$name.m4a)"; else echo "FAIL $name: $(cat err.txt | head -2)"; fi; }
          try he16_44 -d aach -b 16000 -c 1
          try he16_32 -d aach@32000 -b 16000 -c 1
          try he20_32 -d aach@32000 -b 20000 -c 1
          try he24_32 -d aach@32000 -b 24000 -c 1
          try he24_44 -d aach@44100 -b 24000 -c 1
          try he16_22 -d aach@22050 -b 16000 -c 1
          try heS -d aach -s 3 -c 1
          try lc24_22 -d aac@22050 -b 24000 -c 1
          try lc16_16 -d aac@16000 -b 16000 -c 1
          afconvert -hf 2>&1 | grep -iE "aach|m4af" | head -5 || true
      - uses: actions/upload-artifact@v4
        with:
          name: samples
          path: out
