name: Build recitations
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and compress
        run: bash make.sh
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add a24
          git commit -q -m "تلاوات العفاسي مضغوطة (24 ك.ب/ث)" || exit 0
          git push
